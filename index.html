<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examination Timer</title>
<style>
  :root { color-scheme: dark; font: 16px Arial, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh; background: #000; color: white;
    display: grid; place-items: center; text-align: center;
  }
  main {
    width: 100%; padding: 2vh 3vw; display: grid;
    justify-items: center; align-content: center; gap: clamp(4px, 2vh, 24px);
  }
  h1 { font-size: clamp(22px, 3.8vh, 42px); margin: 0; }
  .subject-row { width: 100%; font-size: min(4.7vh, 7vw, 50px); }
  #subjectDisplay, #subject {
    display: block; width: 100%; max-height: 22vh; overflow: auto;
    font: inherit; line-height: 1.15; text-align: center; white-space: pre-wrap;
    overflow-wrap: anywhere; padding: .08em .2em; margin: 0;
    border: 0; border-radius: 0; color: inherit; background: transparent;
  }
  #subjectDisplay { min-height: 1.32em; cursor: text; }
  #subjectDisplay:empty::before { content: 'Enter subject details'; color: #aaa; }
  #subject {
    background: #000; color: #fff; caret-color: white; resize: none;
    outline: none; appearance: none;
  }
  #subject::placeholder { color: #aaa; }
  #subjectDisplay:focus-visible { outline: 1px dashed currentColor; outline-offset: 2px; }
  #currentDate { font-size: min(6.5vh, 9vw, 70px); }
  #currentTime {
    font-size: min(200pt, 24.7vh, 19.5vw); line-height: 1.06; color: green;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #examInfo { font-size: min(9.3vh, 8vw, 100px); font-weight: bold; white-space: nowrap; }
  #examTimer { font-size: clamp(14px, 2.3vh, 25px); }
  #setup { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: .65rem; }
  #setup input, #setup button { font: inherit; padding: .5em .8em; }
  #duration { width: 11em; }
  body.running #currentTime { color: white; }
  body.fifteen #currentTime { color: yellow; }
  body.five #currentTime { color: #e78587; }
  body.finished { background: yellow; color: black; }
  body.finished #currentTime { color: green; }
</style>
</head>
<body>
<main>
  <h1 id="title">Examination Timer</h1>
  <div class="subject-row">
    <button type="button" id="subjectDisplay" aria-label="Edit subject details" title="Click to edit subject details"></button>
    <textarea id="subject" rows="1" hidden aria-label="Subject details" placeholder="Enter subject details" title="Enter to save · Shift+Enter for a new line · Escape to cancel"></textarea>
  </div>
  <div id="currentDate"></div>
  <div id="currentTime"></div>
  <form id="setup">
    <label for="duration">Duration (minutes)</label>
    <input id="duration" type="number" min="1" step="1" required>
    <button type="submit">Start</button>
  </form>
  <div id="examInfo" hidden></div>
  <div id="examTimer" hidden></div>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const subjectLabel = byId('subjectDisplay');
const subjectInput = byId('subject');
function sizeSubjectBox() {
  subjectInput.style.height = 'auto';
  subjectInput.style.height = subjectInput.scrollHeight + 'px';
}
function closeSubject(save, restoreFocus) {
  if (subjectInput.hidden) return;
  if (save) subjectLabel.textContent = subjectInput.value.trim();
  subjectLabel.hidden = false;
  subjectInput.hidden = true;
  if (restoreFocus) subjectLabel.focus({preventScroll: true});
}
subjectLabel.addEventListener('click', () => {
  subjectInput.value = subjectLabel.textContent;
  subjectLabel.hidden = true;
  subjectInput.hidden = false;
  sizeSubjectBox();
  subjectInput.focus();
  subjectInput.setSelectionRange(subjectInput.value.length, subjectInput.value.length);
});
subjectInput.addEventListener('input', sizeSubjectBox);
window.addEventListener('resize', () => { if (!subjectInput.hidden) sizeSubjectBox(); });
subjectInput.addEventListener('blur', () => closeSubject(true, false));
subjectInput.addEventListener('keydown', event => {
  if (event.isComposing) return;
  if (event.key === 'Escape' || (event.key === 'Enter' && !event.shiftKey)) {
    event.preventDefault();
    closeSubject(event.key !== 'Escape', true);
  }
});

const two = number => String(number).padStart(2, '0');
const clockTime = date => [date.getHours(), date.getMinutes(), date.getSeconds()].map(two).join(':');
let endTime = null;
let lastRemaining;
function updateDisplay() {
  const now = new Date();
  byId('currentTime').textContent = clockTime(now);
  byId('currentDate').textContent = [two(now.getDate()), two(now.getMonth() + 1), now.getFullYear()].join(' ');
  if (endTime === null) return;
  const remaining = Math.max(0, Math.ceil((endTime - now.getTime()) / 1000));
  if (remaining === 0) {
    endTime = null;
    document.body.className = 'finished';
    byId('examTimer').textContent = "Time's up!";
    playCue('time_up');
    return;
  }
  document.body.className = remaining <= 300 ? 'five' : remaining <= 900 ? 'fifteen' : 'running';
  byId('examTimer').textContent = 'Time Remaining: ' + Math.floor(remaining / 60) + ':' + two(remaining % 60);
  if (remaining <= 300 && lastRemaining > 300) playCue('five_min_left');
  else if (remaining > 300 && remaining <= 900 && lastRemaining > 900) playCue('fifteen_min_left');
  lastRemaining = Math.min(lastRemaining, remaining);
}

// Unlock sound from the Start gesture, so later announcements work without another click.
const audioBuffers = new Map();
let audioContext;
let playing;
function prepareAudio() {
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (!AudioEngine) return;
  audioContext = new AudioEngine();
  audioContext.resume().catch(() => {});
  for (const clip of document.querySelectorAll('audio')) {
    const bytes = Uint8Array.from(atob(clip.getAttribute('src').split(',')[1]), c => c.charCodeAt(0));
    audioBuffers.set(clip.id, audioContext.decodeAudioData(bytes.buffer).catch(() => null));
  }
}
let cueSequence = 0;
async function playCue(id) {
  const sequence = ++cueSequence;
  if (playing) { playing.stop(); playing = null; }
  const buffer = await audioBuffers.get(id);
  if (sequence !== cueSequence) return;
  if (buffer && audioContext.state === 'running') {
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    gain.gain.value = 0.5;
    source.buffer = buffer;
    source.connect(gain).connect(audioContext.destination);
    source.onended = () => { if (playing === source) playing = null; };
    playing = source;
    source.start();
  } else {
    const clip = byId(id);
    clip.volume = 0.5;
    clip.play().catch(() => {});
  }
}
byId('setup').addEventListener('submit', event => {
  event.preventDefault();
  const minutes = byId('duration').valueAsNumber;
  const start = new Date();
  const end = new Date(start.getTime() + minutes * 60000);
  if (!Number.isInteger(minutes) || minutes < 1 || !Number.isFinite(end.getTime())) return;
  closeSubject(true, false);
  endTime = end.getTime();
  lastRemaining = minutes * 60 + 1;
  // A short exam starts inside the five-minute warning, as on the original timer.
  if (minutes < 5) lastRemaining = 301;
  byId('examInfo').textContent = clockTime(start) + ' - ' + clockTime(end);
  byId('setup').hidden = byId('title').hidden = true;
  byId('examTimer').hidden = byId('examInfo').hidden = false;
  try { prepareAudio(); } catch { /* HTML audio handles devices without Web Audio. */ }
  updateDisplay();
});
setInterval(updateDisplay, 250);
updateDisplay();
</script>
